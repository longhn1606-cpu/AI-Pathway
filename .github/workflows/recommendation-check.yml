name: Recommendation logic checks

on:
  push:
    branches: [feat/recommendation-logic]
  pull_request:
    branches: [feat/frontend-refresh]

jobs:
  recommendation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run recommendation tests
        run: npm run test:recommendation
      - name: Build
        run: npm run build
