name: Demo data and app checks

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build React app and type-check TypeScript
        run: npm run build
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate dataset structure
        run: python data/admissions-seed-2026/validate_data.py
      - name: Run dataset regression tests
        run: python -m unittest discover -s data/admissions-seed-2026 -p "test_*.py"
