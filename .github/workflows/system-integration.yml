name: System integration checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/admissions-seed-2026/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/system-integration.yml'
  push:
    branches: [feat/system-integration]

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run dev -- --host 127.0.0.1 > /tmp/ai-pathway-vite.log 2>&1 &
      - run: npm run test:e2e
