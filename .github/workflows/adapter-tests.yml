name: Adapter unit tests

on:
  pull_request:
    paths:
      - "src/logic/adapters/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/adapter-tests.yml"
  push:
    branches:
      - chore/shared-schema-adapters

jobs:
  adapter-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run adapter unit tests
        run: npm test
