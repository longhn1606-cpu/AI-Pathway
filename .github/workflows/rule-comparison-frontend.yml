name: Rule comparison frontend integration

on:
  push:
    branches: [feat/rule-comparison-frontend-integration]
  pull_request:
    branches: [feat/frontend-profile-integration]

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: npm test
      - name: TypeScript and production build
        run: npm run build
