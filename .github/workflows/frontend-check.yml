name: Frontend checks

on:
  pull_request:
    branches:
      - feat/frontend-refresh
      - main
  push:
    branches:
      - feat/frontend-integration

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript and production build
        run: npm run build
